spring:
  application:
    name: crypto-ai-trader
  datasource:
    url: ${DB_URL:jdbc:mysql://169.58.108.119:3307/crypto_ai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: jean
    password: 123456
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${LOGIN_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
    show-details: when-authorized

binance:
  market-data:
    enabled: true
    base-url: https://data-api.binance.vision
    websocket-base-url: wss://data-stream.binance.vision:443
    default-limit: 500
    request-timeout-seconds: 30
    symbols:
      - BTCUSDT
      - ETHUSDT
      - BNBUSDT
      - XRPUSDT
    intervals:
      - 1m
      - 5m
      - 1h
    historical:
      enabled: true
      limit: 1000
    websocket:
      enabled: true
      reconnect-delay-seconds: 10
      health-check-seconds: 15
collector:
  candle:
    enabled: true
    fixed-delay-ms: 60000

trading:
  symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - XRPUSDT
  intervals:
    - 1m
    - 5m
    - 1h
  candle-limit: 500
  minimum-buy-score: 75
  risk-per-trade-percent: 0.5
  max-daily-loss-percent: 2.0
  max-open-positions: 3
  paper-account-balance: 10000
  scheduled-analysis-enabled: true
  analysis-delay-ms: 300000
  # ATR is a risk engine, not a directional score.
  atr-risk:
    period: ${ATR_PERIOD:14}
    stop-loss-multiplier: ${ATR_STOP_LOSS_MULTIPLIER:2.0}
    take-profit-multiplier: ${ATR_TAKE_PROFIT_MULTIPLIER:3.0}
    low-volatility-percent: ${ATR_LOW_VOLATILITY_PERCENT:0.50}
    high-volatility-percent: ${ATR_HIGH_VOLATILITY_PERCENT:2.50}
    extreme-volatility-percent: ${ATR_EXTREME_VOLATILITY_PERCENT:5.00}
    overextension-multiplier: ${ATR_OVEREXTENSION_MULTIPLIER:2.50}
    minimum-stop-percent: ${ATR_MINIMUM_STOP_PERCENT:0.50}
    maximum-stop-percent: ${ATR_MAXIMUM_STOP_PERCENT:8.00}

    # Strategy-aware entry planning. Trend-following uses these base thresholds.
    # BREAKOUT receives more room; RANGE and DEFENSIVE receive less room.
    reduced-position-multiplier: ${ATR_REDUCED_POSITION_MULTIPLIER:2.00}
    pullback-entry-multiplier: ${ATR_PULLBACK_ENTRY_MULTIPLIER:2.75}
    wait-for-retracement-multiplier: ${ATR_WAIT_FOR_RETRACEMENT_MULTIPLIER:3.50}
    hard-veto-multiplier: ${ATR_HARD_VETO_MULTIPLIER:4.50}
    reduced-position-percent: ${ATR_REDUCED_POSITION_PERCENT:60}


sentiment:
  # Master switch. Keep false until you want sentiment in trade decisions.
  enabled: ${SENTIMENT_ENABLED:true}
  active-window: 24h

  health:
    stale-after: ${SENTIMENT_PROVIDER_STALE_AFTER:2h}
    down-after: ${SENTIMENT_PROVIDER_DOWN_AFTER:6h}

  scheduler:
    # Scheduler also requires sentiment.enabled=true.
    enabled: ${SENTIMENT_SCHEDULER_ENABLED:true}
    fixed-delay-ms: ${SENTIMENT_SCHEDULER_DELAY_MS:60000}

  providers:
    cryptopanic:
      enabled: ${CRYPTOPANIC_ENABLED:false}
      weight: 0.25
      api-key: ${CRYPTOPANIC_API_KEY:}
      base-url: https://cryptopanic.com/api/developer/v2
    news_api:
      enabled: ${NEWS_API_ENABLED:false}
      weight: 0.18
      api-key: ${NEWS_API_KEY:}
      base-url: https://newsapi.org/v2
    reddit:
      enabled: ${REDDIT_SENTIMENT_ENABLED:false}
      weight: 0.14
      api-key: ${REDDIT_ACCESS_TOKEN:}
    x:
      enabled: ${X_SENTIMENT_ENABLED:false}
      weight: 0.12
      api-key: ${X_BEARER_TOKEN:}
    fear_greed:
      # No API key required, but it still follows the master switch.
      enabled: ${FEAR_GREED_ENABLED:true}
      weight: 0.15
      base-url: https://api.alternative.me
    binance_announcement:
      enabled: ${BINANCE_ANNOUNCEMENT_ENABLED:false}
      weight: 0.08
    whale_alert:
      enabled: ${WHALE_ALERT_ENABLED:false}
      weight: 0.20
      api-key: ${WHALE_ALERT_API_KEY:}
    manual_news:
      enabled: ${MANUAL_SENTIMENT_ENABLED:true}
      weight: 0.03

# Whale monitoring and adaptive wallet weighting.
# The collector remains inactive unless WHALE_ENABLED=true, WHALE_ALERT_ENABLED=true,
# and WHALE_ALERT_API_KEY is configured.
whale:
  enabled: ${WHALE_ENABLED:false}

  api:
    base-url: ${WHALE_API_BASE_URL:https://api.whale-alert.io/v1}
    transactions-path: ${WHALE_API_TRANSACTIONS_PATH:/transactions}
    api-key: ${WHALE_ALERT_API_KEY:}

  collection:
    fixed-delay-ms: ${WHALE_COLLECTION_DELAY_MS:300000}
    minimum-usd-value: ${WHALE_MINIMUM_USD_VALUE:1000000}
    limit: ${WHALE_COLLECTION_LIMIT:100}

  evaluation:
    fixed-delay-ms: ${WHALE_EVALUATION_DELAY_MS:60000}
    price-interval: ${WHALE_PRICE_INTERVAL:1m}
    horizons:
      - 1h
      - 4h
      - 24h
    # 0.003 = 0.3%; smaller price movements are considered inconclusive.
    inconclusive-move-percent: ${WHALE_INCONCLUSIVE_MOVE_PERCENT:0.003}

  learning:
    initial-weight: ${WHALE_INITIAL_WEIGHT:0.15}
    minimum-weight: ${WHALE_MINIMUM_WEIGHT:0.05}
    maximum-weight: ${WHALE_MAXIMUM_WEIGHT:1.00}
    smoothing-factor: ${WHALE_SMOOTHING_FACTOR:0.20}
    prior-sample-size: ${WHALE_PRIOR_SAMPLE_SIZE:20}

  aggregation:
    fixed-delay-ms: ${WHALE_AGGREGATION_DELAY_MS:300000}
    active-window: ${WHALE_ACTIVE_WINDOW:2h}
    horizon: ${WHALE_AGGREGATION_HORIZON:4h}
    provider-confidence-floor: ${WHALE_PROVIDER_CONFIDENCE_FLOOR:0.20}

dashboard:
  # Browser-side dashboard refresh cadence. This value is also displayed in the schedule panel.
  refresh-ms: ${DASHBOARD_REFRESH_MS:10000}

# Scoring parameters are explicit and configurable so they can later be calibrated
# by strategy and market regime without changing Java code.
analysis:
  # Live order-book liquidity context. This does not change the /85 score.
  # Persistent walls and depth imbalance are stored as an immutable signal snapshot.
  order-book:
    enabled: ${ORDER_BOOK_ENABLED:true}
    depth-limit: ${ORDER_BOOK_DEPTH_LIMIT:100}
    range-percent: ${ORDER_BOOK_RANGE_PERCENT:2.0}
    snapshot-interval-ms: ${ORDER_BOOK_SNAPSHOT_INTERVAL_MS:5000}
    # Retain enough observations for the longest configured interval window.
    history-size: ${ORDER_BOOK_HISTORY_SIZE:5000}
    minimum-observations: ${ORDER_BOOK_MINIMUM_OBSERVATIONS:5}
    moderate-imbalance: ${ORDER_BOOK_MODERATE_IMBALANCE:0.20}
    strong-imbalance: ${ORDER_BOOK_STRONG_IMBALANCE:0.40}
    wall-size-multiplier: ${ORDER_BOOK_WALL_SIZE_MULTIPLIER:4.0}
    wall-price-tolerance-percent: ${ORDER_BOOK_WALL_PRICE_TOLERANCE_PERCENT:0.15}
    veto-strong-conflict: ${ORDER_BOOK_VETO_STRONG_CONFLICT:true}

    # A shared collector is used, but each signal interval evaluates a different
    # rolling depth window, wall persistence, influence, and veto policy.
    intervals:
      1m:
        window-seconds: ${ORDER_BOOK_1M_WINDOW_SECONDS:60}
        minimum-observations: ${ORDER_BOOK_1M_MINIMUM_OBSERVATIONS:6}
        minimum-wall-persistence-seconds: ${ORDER_BOOK_1M_WALL_PERSISTENCE_SECONDS:20}
        influence: ${ORDER_BOOK_1M_INFLUENCE:1.00}
        allow-veto: ${ORDER_BOOK_1M_ALLOW_VETO:true}
      5m:
        window-seconds: ${ORDER_BOOK_5M_WINDOW_SECONDS:300}
        minimum-observations: ${ORDER_BOOK_5M_MINIMUM_OBSERVATIONS:24}
        minimum-wall-persistence-seconds: ${ORDER_BOOK_5M_WALL_PERSISTENCE_SECONDS:60}
        influence: ${ORDER_BOOK_5M_INFLUENCE:0.80}
        allow-veto: ${ORDER_BOOK_5M_ALLOW_VETO:true}
      15m:
        window-seconds: ${ORDER_BOOK_15M_WINDOW_SECONDS:900}
        minimum-observations: ${ORDER_BOOK_15M_MINIMUM_OBSERVATIONS:60}
        minimum-wall-persistence-seconds: ${ORDER_BOOK_15M_WALL_PERSISTENCE_SECONDS:180}
        influence: ${ORDER_BOOK_15M_INFLUENCE:0.60}
        allow-veto: ${ORDER_BOOK_15M_ALLOW_VETO:true}
      1h:
        window-seconds: ${ORDER_BOOK_1H_WINDOW_SECONDS:3600}
        minimum-observations: ${ORDER_BOOK_1H_MINIMUM_OBSERVATIONS:120}
        minimum-wall-persistence-seconds: ${ORDER_BOOK_1H_WALL_PERSISTENCE_SECONDS:900}
        influence: ${ORDER_BOOK_1H_INFLUENCE:0.30}
        allow-veto: ${ORDER_BOOK_1H_ALLOW_VETO:false}
      4h:
        window-seconds: ${ORDER_BOOK_4H_WINDOW_SECONDS:14400}
        minimum-observations: ${ORDER_BOOK_4H_MINIMUM_OBSERVATIONS:180}
        minimum-wall-persistence-seconds: ${ORDER_BOOK_4H_WALL_PERSISTENCE_SECONDS:1800}
        influence: ${ORDER_BOOK_4H_INFLUENCE:0.15}
        allow-veto: ${ORDER_BOOK_4H_ALLOW_VETO:false}
      1d:
        window-seconds: ${ORDER_BOOK_1D_WINDOW_SECONDS:21600}
        minimum-observations: ${ORDER_BOOK_1D_MINIMUM_OBSERVATIONS:180}
        minimum-wall-persistence-seconds: ${ORDER_BOOK_1D_WALL_PERSISTENCE_SECONDS:3600}
        influence: ${ORDER_BOOK_1D_INFLUENCE:0.00}
        allow-veto: ${ORDER_BOOK_1D_ALLOW_VETO:false}

  # Dynamic BTC relationship/context layer. Every configured altcoin is measured
  # against BTC using aligned closed-candle returns; no symbol-specific Java code is needed.
  btc-context:
    enabled: ${BTC_CONTEXT_ENABLED:true}
    reference-symbol: ${BTC_CONTEXT_REFERENCE_SYMBOL:BTCUSDT}
    window-size: ${BTC_CONTEXT_WINDOW_SIZE:200}
    minimum-samples: ${BTC_CONTEXT_MINIMUM_SAMPLES:120}
    moderate-correlation: ${BTC_CONTEXT_MODERATE_CORRELATION:0.40}
    strong-correlation: ${BTC_CONTEXT_STRONG_CORRELATION:0.70}
    high-beta: ${BTC_CONTEXT_HIGH_BETA:1.30}
    veto-strong-conflict: ${BTC_CONTEXT_VETO_STRONG_CONFLICT:true}
  scoring:
    trend:
      ema-gap-very-weak: 0.25
      ema-gap-weak: 0.50
      ema-gap-moderate: 1.00
      ema-gap-good: 2.00
      ema-gap-strong: 3.00
      ema-gap-optimal: 5.00
      ema-gap-overextended: 8.00
      price-ema200-weak: 1.00
      price-ema200-moderate: 3.00
      price-ema200-strong: 6.00
      price-ema200-optimal: 12.00
      price-ema200-overextended: 20.00
      sma20-weak: 0.25
      sma20-moderate: 1.00
      sma20-optimal: 3.00
      sma20-overextended: 6.00
      ema-separation-atr-weak: 0.50
      ema-separation-atr-moderate: 1.00
      ema-separation-atr-strong: 3.00
    momentum:
      rsi-oversold: 30
      rsi-weak: 40
      rsi-recovering: 45
      rsi-bullish: 50
      rsi-strong: 60
      rsi-hot: 68
      rsi-overbought: 72
      macd-atr-weak: 2
      macd-atr-moderate: 5
      macd-atr-strong: 10
    data-quality:
      minimum-candles: 210
      maximum-missing-candles: 0
      block-on-invalid-ohlc: true

  # Market-driven strategy selection. The system first classifies the current
  # regime, then applies one transparent/versioned profile. Scores are always
  # normalized against the active profile maximum.
  dynamic-strategy:
    enabled: ${DYNAMIC_STRATEGY_ENABLED:true}
    version: ${DYNAMIC_STRATEGY_VERSION:1.0}
    minimum-regime-confidence: ${DYNAMIC_STRATEGY_MINIMUM_CONFIDENCE:55}

    trend-following:
      trend-maximum: 30
      volume-maximum: 20
      momentum-maximum: 15
      sentiment-maximum: 10
      fundamental-maximum: 10
      strong-buy-threshold: 85
      buy-threshold: 75
      watch-threshold: 60
      neutral-threshold: 45
      sell-threshold: 30

    range-mean-reversion:
      trend-maximum: 15
      volume-maximum: 18
      momentum-maximum: 22
      sentiment-maximum: 15
      fundamental-maximum: 15
      strong-buy-threshold: 88
      buy-threshold: 78
      watch-threshold: 65
      neutral-threshold: 45
      sell-threshold: 30

    breakout:
      trend-maximum: 20
      volume-maximum: 30
      momentum-maximum: 20
      sentiment-maximum: 10
      fundamental-maximum: 5
      strong-buy-threshold: 90
      buy-threshold: 80
      watch-threshold: 65
      neutral-threshold: 45
      sell-threshold: 30

    defensive:
      trend-maximum: 25
      volume-maximum: 20
      momentum-maximum: 15
      sentiment-maximum: 10
      fundamental-maximum: 15
      strong-buy-threshold: 90
      buy-threshold: 82
      watch-threshold: 68
      neutral-threshold: 50
      sell-threshold: 35

  # Binance USDⓈ-M futures positioning context. Funding and open interest do not
  # add points to the /85 score; they influence strategy, confidence and safety.
  derivatives-positioning:
    enabled: ${DERIVATIVES_POSITIONING_ENABLED:true}
    base-url: ${BINANCE_FUTURES_BASE_URL:https://fapi.binance.com}
    funding-history-limit: ${FUNDING_HISTORY_LIMIT:100}
    open-interest-history-limit: ${OPEN_INTEREST_HISTORY_LIMIT:3}
    minimum-funding-samples: ${FUNDING_MINIMUM_SAMPLES:20}
    moderate-funding-rate: ${FUNDING_MODERATE_RATE:0.0005}
    extreme-funding-rate: ${FUNDING_EXTREME_RATE:0.0010}
    open-interest-change-threshold: ${OPEN_INTEREST_CHANGE_THRESHOLD:2.0}
    strong-open-interest-change-threshold: ${OPEN_INTEREST_STRONG_CHANGE_THRESHOLD:5.0}
    veto-extreme-crowding: ${DERIVATIVES_VETO_EXTREME_CROWDING:true}


# Automatic market-fundamental collection. Coin IDs stay configuration-only,
# so adding another trading symbol requires YAML changes rather than Java code.
fundamentals:
  collection:
    enabled: ${FUNDAMENTAL_COLLECTION_ENABLED:true}
    base-url: ${COINGECKO_BASE_URL:https://api.coingecko.com/api/v3}
    fixed-delay: ${FUNDAMENTAL_COLLECTION_DELAY:1h}
    stale-after: ${FUNDAMENTAL_STALE_AFTER:6h}
    vs-currency: ${FUNDAMENTAL_VS_CURRENCY:usd}
    coin-ids:
      BTCUSDT: bitcoin
      ETHUSDT: ethereum
      BNBUSDT: binancecoin
      XRPUSDT: ripple
